<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الدفتر">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>الدفتر</title>
<style>
:root{
  --bg:#f3f4f6;--card:#ffffff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--line2:#f1f2f4;
  --accent:#0f766e;--accent-soft:#e2f2f0;--on-accent:#ffffff;
  --debt:#c0262d;--debt-soft:#fdecec;--pay:#15803d;--pay-soft:#e7f6ec;
  --warn:#b45309;--warn-soft:#fdf2e0;--radius:16px;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 4px 14px rgba(17,24,39,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d0f12;--card:#171a1f;--text:#eceef1;--muted:#9aa1ab;--line:#2a2f37;--line2:#20242a;
  --accent:#2bb3a5;--accent-soft:#143230;--on-accent:#04201c;
  --debt:#f2777b;--debt-soft:#3a1d1f;--pay:#5ccf85;--pay-soft:#16301f;
  --warn:#f0b452;--warn-soft:#3a2c14;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active{opacity:.75}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* layout */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;min-height:56px}
header.top h1{font-size:23px;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
main{padding:0 16px calc(104px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;transform:translateZ(0);background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;height:58px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;line-height:1.1;color:var(--muted)}
nav.tabs button i{display:grid;place-items:center;width:52px;height:30px;border-radius:999px}
nav.tabs button span{display:block;height:13px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--accent);font-weight:800}
nav.tabs button.on i{background:var(--accent-soft)}

/* cards & lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stack>*+*{margin-top:12px}
.label{font-size:13px;color:var(--muted)}
.big{font-size:26px;font-weight:800}
.debt{color:var(--debt)}.pay{color:var(--pay)}.warn{color:var(--warn)}.muted{color:var(--muted)}.accent{color:var(--accent)}
.stats3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;padding:0}
.stats3>button,.stats3>div{border:0;background:none;padding:12px 12px;text-align:right;border-left:1px solid var(--line2)}
.stats3>:last-child{border-left:0}
.stats3 .v{font-size:24px;font-weight:800;line-height:1.2}
.stats3 .u{font-size:11.5px;color:var(--muted)}
.banner{border-radius:14px;padding:11px 13px;font-size:14px;display:flex;align-items:center;gap:10px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--debt-soft);color:var(--debt)}
.banner .grow{flex:1}
.banner button{border:0;border-radius:10px;padding:7px 12px;background:currentColor;font-weight:800;font-size:13px;flex:none}
.banner button span{color:var(--card)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:17px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:right;min-height:60px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .title{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);margin-top:3px}
.row .amt{font-weight:800;font-size:18px;text-align:left;flex:none}
.row .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);text-align:left}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700;line-height:1.5}
.pill.debt{background:var(--debt-soft)}.pill.pay{background:var(--pay-soft)}.pill.warn{background:var(--warn-soft)}
.pill.muted{background:var(--line2)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:12px;border-radius:7px;padding:1px 7px;font-weight:800;vertical-align:1px}
.tag.debt{background:var(--debt-soft)}.tag.pay{background:var(--pay-soft)}.tag.warn{background:var(--warn-soft)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.wa-mini{flex:none;border:0;background:var(--pay-soft);color:var(--pay);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.wa-mini svg{width:20px;height:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.fab{position:fixed;left:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:7;border:0;border-radius:18px;
  background:var(--accent);color:var(--on-accent);font-weight:800;padding:15px 20px;box-shadow:0 8px 22px rgba(15,118,110,.35);display:flex;gap:6px;align-items:center;font-size:16px}
.fab svg{width:20px;height:20px}
h2.sec{font-size:15px;color:var(--muted);margin:20px 4px 8px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
h2.sec button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.month-h{background:var(--line2);color:var(--muted);font-size:12.5px;font-weight:800;padding:6px 14px}

/* customer page */
.balance{text-align:center;padding:20px 14px 16px}
.balance .big{font-size:42px;line-height:1.15}
.balance .state{margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:0;border-radius:16px;padding:13px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:800;font-size:13.5px}
.act svg{width:25px;height:25px}
.act.charge{background:var(--debt-soft);color:var(--debt)}
.act.payb{background:var(--pay-soft);color:var(--pay)}
.act.other{background:var(--warn-soft);color:var(--warn)}
.act.wa{background:var(--accent-soft);color:var(--accent)}
.tx .sub span+span::before{content:" · "}
.tx .note{font-size:13px;margin-top:2px}
.opening-row{background:var(--accent-soft)}

/* wallet / report */
.wallet{text-align:center;padding:18px 14px}
.wallet .big{font-size:38px}
.wallet .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .m{flex:1;text-align:center;font-weight:800;font-size:18px}
.rep .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.rep .line:last-child{border-bottom:0}
.rep .line .k{font-size:15px}
.rep .line .k small{display:block;font-size:12px;color:var(--muted)}
.rep .line .v{font-weight:800;font-size:17px}
.rep .total{border-top:2px solid var(--line);margin-top:4px;padding-top:12px}
.rep .total .k{font-weight:800}
.rep .total .v{font-size:22px}

/* modal page */
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.modal header{padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--card)}
.modal header h3{flex:1;margin:0;font-size:18px;text-align:center}
.modal .body{flex:1;overflow:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:17px;background:var(--accent);color:var(--on-accent);width:100%}
.btn.sm{width:auto;padding:8px 14px;font-size:15px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--debt-soft);color:var(--debt)}
.btn.red{background:var(--debt);color:#fff}
.btn.green{background:var(--pay);color:#fff}
.btn:disabled{opacity:.45}
.btn + .btn{margin-top:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 13px;font-size:17px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:130px;resize:vertical;line-height:1.6}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
.amount-box{position:relative}
.amount-box input{font-size:32px !important;font-weight:800;text-align:center;padding:14px 60px !important;direction:ltr}
.amount-box .unit{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:11px;padding:10px 6px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14.5px}
.check{display:flex;align-items:center;gap:10px;font-size:16px;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.err{color:var(--debt);font-size:14px;margin:-4px 0 12px;font-weight:700}
.err:empty{display:none}
.suggest{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.suggest button{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line2);background:none;padding:11px 13px;font-size:16px}
.suggest button:last-child{border-bottom:0}
.batch-grid{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 62px);z-index:60;
  background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{background:var(--debt)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.log-time{font-size:12px;color:var(--muted)}
.more{display:block;margin:12px auto 0}
/* confirm dialog: sits in the middle of the screen, away from the button that opened it */
.dlg-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:24px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:var(--card);border-radius:20px;padding:20px 18px 16px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h4{margin:0 0 8px;font-size:19px}
.dlg p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.6}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>
<div id="dlg"></div>
<script>
'use strict';
const APP_VERSION = '1.3';
const SUB_DAYS = 30;
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

/* ---------------- icons ---------------- */
const I = {
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M16 13h2"/><path d="M2 10h20"/><path d="M6 6V4h12v2"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  fwd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.2-.3-.2-.5-.3z"/></svg>'
};

/* ---------------- helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const pad = n => String(n).padStart(2, '0');
function today(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowISO(){ return new Date().toISOString(); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function diffDays(a, b){ return Math.round((parseD(a) - parseD(b)) / 86400000); }
function fd(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
function fts(iso){ const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function monthName(ym){ const [y, m] = ym.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; }
function shiftMonth(ym, n){ let [y, m] = ym.split('-').map(Number); m += n; while(m > 12){ m -= 12; y++; } while(m < 1){ m += 12; y--; } return `${y}-${pad(m)}`; }
function r2(n){ return Math.round(n * 100) / 100; }
function fn(n){ n = r2(n); return n.toLocaleString('en-US', {maximumFractionDigits: 2}); }
function digits(s){ return String(s ?? '').replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٫,]/g, '.').trim(); }
function num(s){ const v = digits(s); if(v === '') return null; const n = Number(v); return Number.isFinite(n) ? n : NaN; }
function norm(s){ return String(s ?? '').trim().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').toLowerCase(); }
const byDateDesc = (a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : ((a.createdAt || '') < (b.createdAt || '') ? 1 : -1);

/* ---------------- storage ---------------- */
const DB_NAME = 'dafter', STORE = 'kv';
let dbp = null, useLS = false;
function idbOpen(){
  return new Promise((res, rej) => {
    try{
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function kvGet(key){
  if(useLS){ try{ return localStorage.getItem('dafter:'+key); }catch{ return null; } }
  const db = await dbp;
  return new Promise((res, rej) => { const q = db.transaction(STORE, 'readonly').objectStore(STORE).get(key); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); });
}
async function kvSet(key, val){
  if(useLS){ localStorage.setItem('dafter:'+key, val); return; }
  const db = await dbp;
  return new Promise((res, rej) => { const t = db.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(val, key); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
}

function emptyState(){ return {app:'dafter', version:1, customers:[], txns:[], expenses:[], log:[], draft:{batch:[]},
  wallet:{opening:null, openingDate:null, topups:[]}, settings:{actCost:20}, meta:{createdAt:nowISO(), lastBackup:null}}; }
function fixState(o){

  s.draft = s.draft && Array.isArray(s.draft.batch) ? s.draft : {batch:[]};
  s.wallet = {...e.wallet, ...(o.wallet || {})}; if(!Array.isArray(s.wallet.topups)) s.wallet.topups = [];
  s.settings = {...e.settings, ...(o.settings || {})};

}

function cust(id){ return S.customers.find(c => c.id === id); }
const active = () => S.customers.filter(c => !c.deleted);

const KIND = {act:'تفعيل', debt:'دين', pay:'تسديد'};
const actCost = t => (typeof t.cost === 'number' ? t.cost : S.settings.actCost);
function stats(){
  const t0 = today(), m = new Map();
  for(const c of S.customers) m.set(c.id, {bal: c.opening || 0, lastAct:null, lastPay:null, n:0});
  for(const t of S.txns){
    const s = m.get(t.cid); if(!s) continue;
    s.n++;
    if(t.kind === 'pay'){ s.bal -= t.amount; if(!s.lastPay || t.date > s.lastPay) s.lastPay = t.date; }
    else { s.bal += t.amount; if(t.kind === 'act' && (!s.lastAct || t.date > s.lastAct)) s.lastAct = t.date; }
  }
  for(const s of m.values()){
    s.bal = r2(s.bal);
    if(s.lastAct){ s.end = addDays(s.lastAct, SUB_DAYS); s.left = diffDays(s.end, t0); s.st = s.left < 0 ? 'expired' : (s.left <= 3 ? 'soon' : 'ok'); }
    else { s.end = null; s.left = null; s.st = 'none'; }
  }
  return m;
}
function stateText(s){
  if(s.st === 'none') return {t:'ما مفعّل بالتطبيق بعد', c:'muted'};
  if(s.st === 'expired') return {t:`منتهي من ${-s.left} يوم`, c:'debt'};
  if(s.st === 'soon') return {t: s.left === 0 ? 'ينتهي اليوم' : s.left === 1 ? 'ينتهي باچر' : `ينتهي بعد ${s.left} أيام`, c:'warn'};
  return {t:`فعّال لغاية ${fd(s.end)}`, c:'pay'};
}
function balText(b){ return b > 0 ? {t:fn(b), c:'debt', s:'مطلوب'} : b < 0 ? {t:fn(-b), c:'pay', s:'رصيد مقدّم'} : {t:'0', c:'muted', s:'مسدّد'}; }
function custTx(cid){ return S.txns.filter(t => t.cid === cid).sort(byDateDesc); }

/* wallet: opening + top-ups − activation costs, all from the opening date on */
function walletInfo(){
  const w = S.wallet;
  if(w.opening == null || !w.openingDate) return null;
  let top = 0, cost = 0, nAct = 0;
  for(const t of w.topups) if(t.date >= w.openingDate) top += t.amount;
  for(const t of S.txns) if(t.kind === 'act' && t.date >= w.openingDate){ cost += actCost(t); nAct++; }
  return {opening:w.opening, date:w.openingDate, top:r2(top), cost:r2(cost), nAct, bal:r2(w.opening + top - cost)};
}
function monthReport(ym){
  const inM = d => d && d.slice(0,7) === ym;
  let collected = 0, nAct = 0, actVal = 0, actCostSum = 0, topups = 0, exp = 0;
  for(const t of S.txns){
    if(!inM(t.date)) continue;
    if(t.kind === 'pay') collected += t.amount;
    else if(t.kind === 'act'){ nAct++; actVal += t.amount; actCostSum += actCost(t); }
  }
  for(const t of S.wallet.topups) if(inM(t.date)) topups += t.amount;
  for(const e of S.expenses) if(inM(e.date)) exp += e.amount;
  return {collected:r2(collected), nAct, actVal:r2(actVal), actCost:r2(actCostSum), profit:r2(actVal - actCostSum), topups:r2(topups), exp:r2(exp), net:r2(collected - topups - exp)};
}

/* ---------------- whatsapp ---------------- */
function waNumber(p){
  let d = digits(p).replace(/\D/g, '');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('0')) d = '964' + d.slice(1);
  else if(d.length === 10 && d.startsWith('7')) d = '964' + d;
  return d;
}

// المبالغ بالتطبيق بالألف، وبالرسائل تنكتب كاملة: 35 ← 35,000 دينار
function money(n){ return Math.round(n * 1000).toLocaleString('en-US') + ' دينار'; }
function fill(t, v){ return t.replace(/\{([^}]+)\}/g, (m, k) => (k in v ? v[k] : m)); }
function balLine(b){ return b > 0 ? fill(MSG.balDue, {'المبلغ': money(b)}) : b < 0 ? fill(MSG.balCredit, {'المبلغ': money(-b)}) : MSG.balZero; }
function msgFor(type, c, s, extra){
  extra = extra || {};
  const v = {'الاسم': c.name, 'سطر المبلغ': balLine(s.bal), 'تاريخ اليوم': fd(today()), 'تاريخ الانتهاء': s.end ? fd(s.end) : ''};
  let t;
  if(type === 'act'){ v['تاريخ التفعيل'] = fd(extra.date); v['تاريخ الانتهاء'] = fd(addDays(extra.date, SUB_DAYS)); t = MSG.act; }
  else if(type === 'pay'){ v['مبلغ التسديد'] = money(extra.amount); v['التاريخ'] = fd(extra.date); t = MSG.pay; }
  else if(type === 'expiry' && s.end) t = s.left < 0 ? MSG.expired : MSG.soon;
  else t = MSG.general;
  const out = fill(t, v);
  return MSG.sign ? out + '\n' + MSG.sign : out;
}
function openWhatsApp(c, text){

}

function fab(){ return `<button class="fab" data-act="addCustomer">${I.plus}<span>زبون</span></button>`; }
function customerRows(st){
  const q = norm(UI.q), f = UI.filter;
  let rows = S.customers.filter(c => {
    const s = st.get(c.id);
    if(f === 'deleted') return !!c.deleted && (!q || norm(c.name).includes(q));
    if(c.deleted) return false;
    if(q && !norm(c.name).includes(q)) return false;
    if(f === 'stopped') return !!c.stopped;
    if(q) return true;
    if(c.stopped) return false;
    if(f === 'debt') return s.bal > 0;
    if(f === 'soon') return s.st === 'soon';
    if(f === 'expired') return s.st === 'expired';
    if(f === 'noopen') return c.opening == null;
    return true;
  });
  if(f === 'soon' || f === 'expired') rows.sort((a,b) => st.get(a.id).left - st.get(b.id).left);
  else rows.sort((a,b) => (st.get(b.id).bal - st.get(a.id).bal) || a.name.localeCompare(b.name, 'ar'));
  if(!rows.length) return `<div class="empty">ماكو نتائج</div>`;
  return rows.map(c => {
    const s = st.get(c.id), b = balText(s.bal), x = stateText(s);

  }).join('');
}

    ? `<div style="margin-top:28px"><button class="btn danger" data-act="delCustomer" data-id="${c.id}">حذف الزبون</button></div>`
    : `<div class="hint" style="margin-top:24px;text-align:center">الحذف متاح بس إذا حساب الزبون صفر (هسه ${balText(bal).s}: ${fn(Math.abs(bal))}).</div>`;
  openModal(isNew ? 'زبون جديد' : 'تعديل الزبون', body, 'حفظ', async () => {
    const name = fv('f_name').trim().replace(/\s+/g, ' ');
    const price = num(fv('f_price')), open = num(fv('f_open'));
    if(!name) return showErr('اكتب الاسم');
    if(active().some(x => x.id !== c.id && norm(x.name) === norm(name))) return showErr('هذا الاسم موجود. اكتب اسم مميز (مثلاً أضف اسم الأب).');
    if(price === null || Number.isNaN(price) || price < 0) return showErr('سعر الاشتراك غلط');
    if(Number.isNaN(open)) return showErr('الدين الافتتاحي غلط');
    const phone = fv('f_phone').trim(), note = fv('f_note').trim();
    if(isNew){
      const nc = {id:uid(), name, phone, price, opening:open, openingDate: open == null ? null : today(), note, stopped:false, createdAt:nowISO()};
      S.customers.push(nc); closeModal();
      await commit({type:'زبون جديد', cid:nc.id, text:`${name}${open != null ? ` — دين افتتاحي ${fn(open)}` : ''}`});
      UI.listScroll = window.scrollY; UI.view = {name:'customer', id:nc.id}; history.pushState({v:1}, ''); render(); scrollTo(0,0); toast('انضاف الزبون');
    } else {
      const ch = [];
      if(c.name !== name) ch.push(`الاسم: ${c.name} ← ${name}`);
      if((c.phone||'') !== phone) ch.push(`الهاتف: ${c.phone || '—'} ← ${phone || '—'}`);
      if(c.price !== price) ch.push(`السعر: ${fn(c.price)} ← ${fn(price)}`);
      if(c.opening !== open) ch.push(`الدين الافتتاحي: ${c.opening == null ? '—' : fn(c.opening)} ← ${open == null ? '—' : fn(open)}`);
      if((c.note||'') !== note) ch.push('الملاحظة');
      const stop = !!(document.getElementById('f_stop') || {}).checked;
      if(!!c.stopped !== stop) ch.push(stop ? 'صار متوقف' : 'رجع فعّال');
      if(c.opening !== open && open != null) c.openingDate = today();
      Object.assign(c, {name, phone, price, opening:open, note, stopped:stop});
      closeModal();
      if(ch.length) await commit({type:'تعديل زبون', cid:c.id, text:`${name}: ${ch.join('، ')}`}); else render();
      toast('انحفظ');
    }
  });
  if(del) $('.modal .body').insertAdjacentHTML('beforeend', del);
}

/* transaction form */
function txForm(kind, cid, t){
  const c = cust(cid), s = stats().get(cid), isNew = !t;
  t = t || {kind, date:today(), amount: kind === 'act' ? c.price : '', place:'قيس', by:'عز', note:''};
  kind = t.kind;
  const title = (isNew ? '' : 'تعديل ') + (kind === 'act' ? 'تفعيل' : kind === 'pay' ? 'تسديد' : 'دين آخر') + ' — ' + c.name;
  let body = `<div class="err" id="ferr"></div>` + amountField('f_amt', kind === 'act' ? 'مبلغ الاشتراك على الزبون' : 'المبلغ', t.amount, kind === 'pay' && s.bal > 0 ? fn(s.bal) : '0');
  if(kind === 'pay'){
    const q = [c.price, c.price * 2]; if(s.bal > 0 && !q.includes(s.bal)) q.push(s.bal);
    body += `<div class="quick">${q.map(v => `<button type="button" data-act="quickAmt" data-v="${v}">${fn(v)}${v === s.bal ? ' (الكل)' : ''}</button>`).join('')}</div>`;
  }
  body += `</div><div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${t.date}">`;
  if(kind === 'act') body += `<div class="hint" id="f_endhint">ينتهي الاشتراك بتاريخ ${fd(addDays(t.date, SUB_DAYS))}</div>`;
  body += `</div>`;
  if(kind === 'act') body += `<div class="field"><label>الكلفة من رصيدي (ألف)</label><input id="f_cost" inputmode="decimal" value="${esc(isNew ? S.settings.actCost : actCost(t))}">
      <div class="hint">تنخصم من رصيدك عند المزوّد. غيّرها إذا الاشتراك مختلف.</div></div>`;
  if(kind === 'pay') body += `<div class="field"><label>مكان التسديد</label>${segHTML('f_place', ['قيس','مباشر'], t.place || 'قيس')}</div>
      <div class="field"><label>استلم من قبل</label><input id="f_by" value="${esc(t.by || 'عز')}"></div>`;
  body += `<div class="field"><label>${kind === 'debt' ? 'السبب / ملاحظة' : 'ملاحظة'}</label><input id="f_note" value="${esc(t.note)}"></div>`;
  openModal(title, body, 'حفظ', async () => {
    const date = fv('f_date'), amt = num(fv('f_amt'));
    if(amt === null || Number.isNaN(amt) || amt <= 0) return showErr('اكتب مبلغ صحيح');
    if(!date) return showErr('اختار التاريخ');
    let cost;
    if(kind === 'act'){ cost = num(fv('f_cost')); if(cost === null || Number.isNaN(cost) || cost < 0) return showErr('اكتب الكلفة (أو 0)'); }
    const place = kind === 'pay' ? ($('#f_place').dataset.val || 'قيس') : undefined;
    const by = kind === 'pay' ? (fv('f_by').trim() || 'عز') : undefined;
    const note = fv('f_note').trim();
    const desc = x => `${KIND[x.kind]} ${fn(x.amount)} بتاريخ ${fd(x.date)}${x.kind === 'act' ? ` (كلفة ${fn(actCost(x))})` : ''}${x.kind === 'pay' ? ` (${x.place === 'مباشر' ? 'مباشر' : 'عند قيس'}، استلم: ${x.by})` : ''}${x.note ? ' — ' + x.note : ''}`;
    if(isNew){
      const nt = {id:uid(), cid, kind, date, amount:amt, note, createdAt:nowISO()};
      if(kind === 'pay'){ nt.place = place; nt.by = by; }
      if(kind === 'act') nt.cost = cost;
      S.txns.push(nt); closeModal();
      await commit({type:KIND[kind], cid, text:`${c.name}: ${desc(nt)}`});
      const ns = stats().get(cid);
      if(kind === 'act') waPrompt(c, msgFor('act', c, ns, {date}), 'انحفظ التفعيل ✓');
      else if(kind === 'pay'){ waPrompt(c, msgFor('pay', c, ns, {date, amount:amt}), 'انحفظ التسديد ✓'); toast(`${balText(ns.bal).s}: ${fn(Math.abs(ns.bal))}`); }
      else toast(`انحفظ ✓ — ${balText(ns.bal).s}: ${fn(Math.abs(ns.bal))}`);
    } else {
      const before = desc(t);
      Object.assign(t, {date, amount:amt, note, updatedAt:nowISO()});
      if(kind === 'pay'){ t.place = place; t.by = by; }
      if(kind === 'act') t.cost = cost;
      closeModal();
      const after = desc(t);
      if(before !== after) await commit({type:'تعديل حركة', cid, text:`${c.name}: ${before} ← ${after}`}); else render();
      toast('انحفظ');
    }
  });
  if(!isNew) $('.modal .body').insertAdjacentHTML('beforeend', `<div style="margin-top:28px"><button class="btn danger" data-act="delTx" data-id="${t.id}">حذف هذي الحركة</button></div>`);
}

  const q = norm(fv('b_name')); const box = $('#b_sug'); batchPick = null;

      <div><span class="tag ${/حذف/.test(l.type) ? 'debt' : /تسديد/.test(l.type) ? 'pay' : 'acc'}">${esc(l.type)}</span> ${esc(l.text)}</div></div></div>`).join('')}</div>`
    : `<div class="card empty">السجل فارغ</div>`;
  if(L.length > shown.length) h += `<button class="btn ghost sm more" data-act="logMore">عرض المزيد (${L.length - shown.length})</button>`;
  $('#main').innerHTML = h + '</div>';
}

/* ---------------- backup ---------------- */
async function renderBackup(){
  setTop('النسخ الاحتياطي');
  const lb = S.meta.lastBackup;
  let h = `<div class="stack"><div class="card">
      <div class="kv"><span>آخر نسخة احتياطية</span><b>${lb ? `<span class="num">${fts(lb)}</span>` : 'ما صارت'}</b></div>
      <div class="kv"><span>الزبائن</span><b class="num">${active().length}</b></div>
      <div class="kv"><span>الحركات</span><b class="num">${S.txns.length}</b></div>
      <div class="kv"><span>المصاريف</span><b class="num">${S.expenses.length}</b></div>
      <div class="kv"><span>شحنات الرصيد</span><b class="num">${S.wallet.topups.length}</b></div>
      <div class="kv"><span>حماية التخزين من المسح</span><b id="persist">…</b></div></div>
    <button class="btn" data-act="exportBackup">تصدير نسخة احتياطية</button>
    <div class="label">يطلعلك خيار المشاركة: احفظها بـ"الملفات" أو دزها لنفسك بتيليغرام أو واتساب. سويها كل أسبوع.</div>
    <button class="btn ghost" data-act="pickRestore">استعادة من نسخة احتياطية</button>
    <div class="label">تختار ملف النسخة، ويعرضلك شنو بيه قبل ما يستبدل البيانات الحالية.</div>
    <input type="file" id="restoreFile" hidden>
    <div id="undoRestore"></div>
    <div class="card"><div class="label" style="line-height:1.7">• البيانات محفوظة بس داخل هذا الموبايل، ما تطلع لأي مكان.<br>
      • افتح التطبيق دائماً من الأيقونة بالشاشة الرئيسية، مو من Safari.<br>
      • إذا مسحت التطبيق أو بيانات Safari أو ضاع الموبايل، ترجع البيانات بس من نسخة احتياطية.<br>
      • تكدر تفتح نفس الرابط باللابتوب وتستعيد نسخة حتى تشوف البيانات هناك (تبقى نسخة منفصلة).</div></div>
    <div class="label" style="text-align:center">الدفتر — الإصدار ${APP_VERSION}</div></div>`;
  $('#main').innerHTML = h;
  try{ const p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; const el = $('#persist'); if(el) el.textContent = p === null ? 'غير معروف' : p ? 'نعم' : 'لا'; }catch{}
  try{ const prev = await kvGet('state_before_restore'); const el = $('#undoRestore'); if(prev && el) el.innerHTML = `<button class="btn ghost" data-act="undoRestore">رجّع البيانات اللي كانت قبل آخر استعادة</button>`; }catch{}
}
function backupName(){ const d = new Date(); return `dafter-backup-${today()}-${pad(d.getHours())}${pad(d.getMinutes())}.json`; }
async function exportBackup(){
  const data = JSON.stringify({...S, exportedAt:nowISO()}, null, 1);
  const name = backupName();
  let done = false;
  for(const type of ['application/json', 'text/plain']){
    const file = new File([data], name, {type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'نسخة احتياطية — الدفتر'}); done = true; }
      catch(e){ if(e && e.name === 'AbortError') return toast('انلغت'); continue; }
      break;
    }
  }
  if(!done){
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  S.meta.lastBackup = nowISO();
  await commit({type:'تصدير نسخة', text:`${name} — ${active().length} زبون، ${S.txns.length} حركة`});
  toast('انصدّرت النسخة ✓');
}
function validBackup(o){
  return o && o.app === 'dafter' && Array.isArray(o.customers) && Array.isArray(o.txns) && Array.isArray(o.expenses) && Array.isArray(o.log)
    && o.customers.every(c => c && c.id && typeof c.name === 'string')
    && o.txns.every(t => t && t.id && t.cid && ['act','debt','pay'].includes(t.kind) && typeof t.amount === 'number' && /^\d{4}-\d\d-\d\d$/.test(t.date));
}
let pendingRestore = null;
async function restoreFrom(file){
  let o;
  try{ o = JSON.parse(await file.text()); }catch{ return toast('الملف مو نسخة احتياطية صحيحة', true); }
  if(!validBackup(o)) return toast('الملف مو نسخة احتياطية من الدفتر', true);
  const body = `<div class="card"><div class="kv"><span>تاريخ النسخة</span><b class="num">${o.exportedAt ? fts(o.exportedAt) : '—'}</b></div>
      <div class="kv"><span>الزبائن</span><b class="num">${o.customers.filter(c => !c.deleted).length}</b></div><div class="kv"><span>الحركات</span><b class="num">${o.txns.length}</b></div>
      <div class="kv"><span>المصاريف</span><b class="num">${o.expenses.length}</b></div></div>
    <div class="banner warn" style="margin:14px 0">راح تنمسح البيانات الحالية (${active().length} زبون، ${S.txns.length} حركة) وتحل محلها هذي النسخة. البيانات الحالية تنحفظ بشكل مؤقت وتكدر ترجعها.</div>
    <button class="btn" data-act="confirmRestore">استعادة</button>`;
  pendingRestore = o;
  openModal('استعادة نسخة', body);
}
async function confirmRestore(){
  const o = pendingRestore; if(!o) return;
  await kvSet('state_before_restore', JSON.stringify(S));
  const lb = S.meta.lastBackup;
  S = fixState(o); delete S.exportedAt;
  S.meta.lastBackup = o.exportedAt || S.meta.lastBackup || lb;
  pendingRestore = null; closeModal(); UI.view = null; UI.tab = 'customers';
  await commit({type:'استعادة نسخة', text:`${o.customers.length} زبون، ${o.txns.length} حركة، ${o.expenses.length} مصروف${o.exportedAt ? ' — نسخة ' + fts(o.exportedAt) : ''}`});
  toast('انستعادت النسخة ✓');
}
async function undoRestore(){
  const prev = await kvGet('state_before_restore'); if(!prev) return;
  const o = JSON.parse(prev); const cur = JSON.stringify(S);
  S = fixState(o); await kvSet('state_before_restore', cur);
  await commit({type:'تراجع عن استعادة', text:'رجعت البيانات اللي كانت قبل آخر استعادة'});
  toast('رجعت البيانات السابقة');
}

/* ---------------- events ---------------- */
function goBack(){ UI.view = null; render(); requestAnimationFrame(() => scrollTo(0, UI.listScroll || 0)); }
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  try{
    switch(a){
      case 'noop': return;
      case 'dlgCancel': if(el.classList.contains('dlg-back') && Date.now() - dlgOpenedAt < 500) return; closeDlg(); return;
      case 'dlgOk': { if(Date.now() - dlgOpenedAt < 450) return; const f = dlgOk; closeDlg(); if(f) await f(); return; }
      case 'tab': if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); UI.tab = el.dataset.k; UI.view = null; closeModal(); render(); scrollTo(0,0); break;
      case 'filter': UI.filter = el.dataset.k; render(); break;
      case 'openCustomer': UI.listScroll = window.scrollY; UI.view = {name:'customer', id}; history.pushState({v:1}, ''); render(); scrollTo(0,0); break;
      case 'back': if(history.state && history.state.v){ history.back(); } else goBack(); break;
      case 'addCustomer': customerForm(null); break;
      case 'editCustomer': customerForm(cust(id)); break;
      case 'delCustomer': {
        const c = cust(id);
        confirmBox('حذف الزبون؟', `راح يختفي <b>${esc(c.name)}</b> من القوائم. حركاته القديمة تبقى محسوبة بكشف الأشهر، وتكدر ترجّعه من فلتر "المحذوفين".`, 'حذف', async () => {
          c.deleted = true; c.deletedAt = nowISO(); closeModal(); UI.view = null;
          await commit({type:'حذف زبون', cid:c.id, text:c.name}); goBack(); toast('انحذف الزبون');
        });
        break; }
      case 'restoreCustomer': {
        const c = cust(id);
        if(active().some(x => norm(x.name) === norm(c.name))) return toast('أكو زبون فعّال بنفس الاسم. غيّر اسم واحد منهم أول.', true);
        c.deleted = false; delete c.deletedAt;
        await commit({type:'استرجاع زبون', cid:c.id, text:c.name}); toast('رجع الزبون');
        break; }
      case 'txForm': txForm(el.dataset.kind, id); break;
      case 'editTx': { const t = S.txns.find(x => x.id === id); if(t) txForm(t.kind, t.cid, t); break; }
      case 'delTx': {
        const t = S.txns.find(x => x.id === id), c = cust(t.cid);
        confirmBox('حذف الحركة؟', `${KIND[t.kind]} <b class="num">${fn(t.amount)}</b> بتاريخ ${fd(t.date)} — ${esc(c ? c.name : '')}`, 'حذف', async () => {
          S.txns = S.txns.filter(x => x.id !== id); closeModal();
          await commit({type:'حذف حركة', cid:t.cid, text:`${c ? c.name : ''}: ${KIND[t.kind]} ${fn(t.amount)} بتاريخ ${fd(t.date)}${t.note ? ' — ' + t.note : ''}`}); toast('انحذفت الحركة');
        });
        break; }
      case 'quickAmt': $('#f_amt').value = el.dataset.v; break;
      case 'seg': { const seg = el.parentElement; seg.dataset.val = el.dataset.v; [...seg.children].forEach(b => b.classList.toggle('on', b === el)); if(seg.id === 'b_place') UI.batch.place = el.dataset.v; break; }
      case 'closeModal': closeModal(); pendingRestore = null; break;
      case 'modalSave': if(modalSave) await modalSave(); break;
      case 'waCustomer': { const c = cust(id), s = stats().get(id); waPrompt(c, msgFor(s.st === 'soon' || s.st === 'expired' ? 'expiry' : 'general', c, s)); break; }
      case 'waExpiry': { const c = cust(id), s = stats().get(id); waPrompt(c, msgFor('expiry', c, s)); break; }
      case 'sendWa': openWhatsApp(cust(id), fv('f_msg')); closeModal(); break;
      case 'batchPick': { const c = cust(id); $('#b_name').value = c.name; batchPick = c.id; $('#b_sug').innerHTML = ''; $('#b_amt').focus(); break; }
      case 'batchAdd': {
        const date = fv('b_date'), amt = num(fv('b_amt')), by = fv('b_by').trim() || 'عز';
        if(!batchPick){ const ex = active().find(c => norm(c.name) === norm(fv('b_name'))); if(ex) batchPick = ex.id; }
        if(!date) return showErr('اختار التاريخ');
        if(!batchPick) return showErr('اختار الاسم من القائمة');
        if(amt === null || Number.isNaN(amt) || amt <= 0) return showErr('اكتب مبلغ صحيح');
        UI.batch.date = date; UI.batch.by = by;
        S.draft.batch.push({cid:batchPick, amount:amt, date, place:UI.batch.place, by});
        batchPick = null; await save(); render(); $('#b_name').focus(); break; }
      case 'batchDel': S.draft.batch.splice(Number(el.dataset.i), 1); await save(); render(); break;
      case 'batchSave': {
        const items = S.draft.batch; if(!items.length) return;
        const logs = [];
        for(const x of items){
          const c = cust(x.cid); if(!c) continue;
          S.txns.push({id:uid(), cid:x.cid, kind:'pay', date:x.date, amount:x.amount, place:x.place, by:x.by, note:'', createdAt:nowISO()});
          logs.push({type:'تسديد', cid:x.cid, text:`${c.name}: تسديد ${fn(x.amount)} بتاريخ ${fd(x.date)} (${x.place === 'مباشر' ? 'مباشر' : 'عند قيس'}، استلم: ${x.by}) — من الدفتر`});
        }
        const n = items.length; S.draft.batch = [];
        await commit(logs); toast(`انحفظت ${n} تسديدات ✓`); break; }
      case 'month': UI.month = shiftMonth(UI.month, Number(el.dataset.n)); render(); break;
      case 'openingForm': openingForm(); break;
      case 'addTopup': topupForm(null); break;
      case 'editTopup': topupForm(S.wallet.topups.find(x => x.id === id)); break;
      case 'delTopup': {
        const t = S.wallet.topups.find(x => x.id === id);
        confirmBox('حذف الشحن؟', `شحن <b class="num">${fn(t.amount)}</b> بتاريخ ${fd(t.date)}`, 'حذف', async () => {
          S.wallet.topups = S.wallet.topups.filter(x => x.id !== id); closeModal();
          await commit({type:'حذف شحن', text:`${fn(t.amount)} بتاريخ ${fd(t.date)}${t.note ? ' — ' + t.note : ''}`}); toast('انحذف');
        });
        break; }
      case 'costForm': costForm(); break;
      case 'addExp': expForm(null); break;
      case 'editExp': expForm(S.expenses.find(x => x.id === id)); break;
      case 'delExp': {
        const e = S.expenses.find(x => x.id === id);
        confirmBox('حذف المصروف؟', `<b class="num">${fn(e.amount)}</b> بتاريخ ${fd(e.date)}${e.reason ? ' — ' + esc(e.reason) : ''}`, 'حذف', async () => {
          S.expenses = S.expenses.filter(x => x.id !== id); closeModal();
          await commit({type:'حذف مصروف', text:`${fn(e.amount)} بتاريخ ${fd(e.date)}${e.reason ? ' — ' + e.reason : ''}`}); toast('انحذف');
        });
        break; }
      case 'logMore': UI.logLimit += 150; render(); break;
      case 'exportBackup': await exportBackup(); break;
      case 'pickRestore': { const f = $('#restoreFile'); f.value = ''; f.click(); break; }
      case 'confirmRestore': await confirmRestore(); break;
      case 'undoRestore': await undoRestore(); break;
    }
  }catch(e){ console.error(e); toast('صار خطأ: ' + (e && e.message || e), true); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id === 'q'){ UI.q = t.value; $('#clist').innerHTML = customerRows(stats()); }
  else if(t.id === 'lq'){ UI.logQ = t.value; const pos = t.selectionStart; renderLog(); const n = $('#lq'); n.focus(); try{ n.setSelectionRange(pos, pos); }catch{} }
  else if(t.id === 'b_name') batchSuggest();
  else if(t.id === 'b_date') UI.batch.date = t.value;
  else if(t.id === 'b_by') UI.batch.by = t.value;
  else if(t.id === 'f_date' && $('#f_endhint')) $('#f_endhint').textContent = t.value ? 'ينتهي الاشتراك بتاريخ ' + fd(addDays(t.value, SUB_DAYS)) : '';
});
/* iOS: بعد ما يتسد الكيبورد، نرجّع الصفحة لمكانها حتى ما يبقى الشريط السفلي مرتفع */
document.addEventListener('focusout', ev => { if(/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) setTimeout(() => { const a = document.activeElement; if(!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) window.scrollTo(window.scrollX, window.scrollY); }, 120); });
document.addEventListener('change', ev => {
  if(ev.target.id === 'restoreFile' && ev.target.files[0]) restoreFrom(ev.target.files[0]);
});
window.addEventListener('popstate', () => { if($('#dlg').innerHTML){ closeDlg(); return; } if($('#layer').innerHTML){ closeModal(); return; } if(UI.view) goBack(); });

/* ---------------- boot ---------------- */
(async function boot(){
  try{ dbp = idbOpen(); await dbp; }
  catch(e){ useLS = true; console.warn('IndexedDB unavailable, using localStorage', e); }
  try{
    const raw = await kvGet('state');
    if(raw) S = fixState(JSON.parse(raw));
  }catch(e){ console.error(e); toast('ما كدرت أقرا البيانات المحفوظة', true); }
  render();
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch{}
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
